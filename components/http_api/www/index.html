<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f4">
  <meta name="color-scheme" content="light">
  <meta name="app-build" content="2026.11.11-stock-r3">
  <title>股票监控设备配置</title>
  <link rel="manifest" href="/manifest.webmanifest?v=2026.11.11-stock-r3">
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2026.11.11-stock-r3">
  <style>
    :root {
      --page: #f3f6f4;
      --surface: #ffffff;
      --surface-muted: #eaf0ed;
      --ink: #17211d;
      --muted: #52615b;
      --line: #c7d2cd;
      --line-strong: #8fa19a;
      --accent: #116b55;
      --accent-strong: #084b3b;
      --accent-soft: #dff3ec;
      --warning: #8a4b00;
      --warning-soft: #fff0d7;
      --danger: #9d2028;
      --danger-soft: #fde7e8;
      --focus: #0b6fda;
      --radius: 8px;
      --shadow: 0 10px 28px rgba(22, 43, 34, 0.08);
      --font:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans CJK SC",
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 300px;
      min-height: 100%;
      background: var(--page);
      color-scheme: light;
    }

    body {
      min-width: 300px;
      min-height: 100vh;
      margin: 0;
      padding-bottom: calc(104px + env(safe-area-inset-bottom));
      background: var(--page);
      color: var(--ink);
      font-family: var(--font);
      font-size: 18px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    label,
    select,
    input {
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .shell {
      width: min(100%, 960px);
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        24px
        max(14px, env(safe-area-inset-left));
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0 22px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: var(--accent);
      color: #ffffff;
      box-shadow: var(--shadow);
    }

    .brand-mark svg {
      width: 30px;
      height: 30px;
      stroke-width: 2;
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 2.35rem;
      letter-spacing: 0;
      line-height: 1.18;
    }

    .connection-badge {
      min-height: 42px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .connection-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: var(--line-strong);
    }

    .connection-badge[data-state="online"] {
      border-color: #6aa994;
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .connection-badge[data-state="online"] .connection-dot {
      background: var(--accent);
    }

    .connection-badge[data-state="warning"] {
      border-color: #d8a14b;
      background: var(--warning-soft);
      color: var(--warning);
    }

    .connection-badge[data-state="warning"] .connection-dot {
      background: #c57a10;
    }

    .connection-badge[data-state="offline"] {
      border-color: #d99498;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .connection-badge[data-state="offline"] .connection-dot {
      background: var(--danger);
    }

    main {
      display: grid;
      gap: 18px;
    }

    .section-stack {
      display: grid;
      gap: 18px;
    }

    .section {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .section-title {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .section-title svg {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      color: var(--accent);
      stroke-width: 2;
    }

    h2 {
      margin: 0;
      font-size: 1.42rem;
      letter-spacing: 0;
      line-height: 1.28;
    }

    .section-note {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-bottom: 20px;
      padding: 14px 16px;
      border-left: 4px solid var(--accent);
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 1rem;
    }

    .status-strip strong {
      color: var(--ink);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field-label,
    legend {
      color: var(--ink);
      font-size: 1.03rem;
      font-weight: 800;
    }

    .field-help {
      margin: -2px 0 2px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      min-height: 54px;
      padding: 10px 13px;
      border: 2px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 1.06rem;
    }

    input::placeholder {
      color: #74847d;
      opacity: 1;
    }

    input[aria-invalid="true"],
    select[aria-invalid="true"] {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .input-action {
      position: relative;
      min-width: 0;
    }

    .input-action input {
      padding-right: 58px;
    }

    .field-action {
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 9px 16px;
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--accent-strong);
      font-weight: 800;
      cursor: pointer;
    }

    .field-action:hover {
      background: var(--accent-soft);
    }

    .field-action.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .field-action.primary:hover {
      background: var(--accent-strong);
    }

    .field-action svg,
    .input-icon-button svg,
    .stock-remove svg,
    .save-button svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      stroke-width: 2;
    }

    .input-icon-button {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .input-icon-button:hover {
      background: var(--surface-muted);
      color: var(--ink);
    }

    .wifi-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
    }

    .wifi-actions .field-action {
      flex: 1 1 190px;
    }

    #wifiNetwork {
      display: none;
    }

    #wifiNetwork.is-visible {
      display: block;
    }

    .stock-list {
      display: grid;
      gap: 0;
    }

    .stock-row {
      min-width: 0;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }

    .stock-row:first-child {
      padding-top: 2px;
      border-top: 0;
    }

    .stock-row:last-child {
      padding-bottom: 0;
    }

    .stock-row-head {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 10px;
    }

    .stock-index {
      color: var(--muted);
      font-size: 0.96rem;
      font-weight: 800;
      text-align: center;
    }

    .stock-symbol-field {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .stock-symbol-label,
    .stock-limit-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .stock-remove,
    .stock-add {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .stock-remove {
      width: 48px;
      padding: 0;
      border: 2px solid var(--line);
      background: var(--surface);
      color: var(--danger);
    }

    .stock-remove:hover {
      border-color: #d99498;
      background: var(--danger-soft);
    }

    .stock-remove[hidden] {
      visibility: hidden;
      display: inline-flex;
    }

    .stock-add {
      margin-top: 14px;
      padding: 10px 16px;
      border: 2px dashed var(--line-strong);
      background: var(--surface);
      color: var(--accent-strong);
      font-weight: 800;
    }

    .stock-add:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .stock-add[hidden] {
      display: none;
    }

    .stock-market {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 13px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
    }

    .stock-stat {
      min-width: 0;
      display: grid;
      gap: 1px;
      padding: 10px 12px;
      background: var(--surface-muted);
    }

    .stock-stat-label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .stock-stat-value {
      overflow: hidden;
      font-size: 1.12rem;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stock-stat-change {
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
    }

    .stock-row.is-upper-alert .stock-current-value,
    .stock-stat-change[data-direction="up"] {
      color: var(--danger);
    }

    .stock-row.is-lower-alert .stock-current-value,
    .stock-stat-change[data-direction="down"] {
      color: var(--accent-strong);
    }

    .stock-limits {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .stock-limit-field {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .stock-limit-hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .switch-field {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 13px;
      border: 2px solid var(--line-strong);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .switch-copy {
      display: grid;
      gap: 1px;
      font-weight: 800;
    }

    .switch-copy small {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .switch-control {
      position: relative;
      width: 58px;
      height: 34px;
      flex: 0 0 58px;
    }

    .switch-control input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 2px solid var(--line-strong);
      border-radius: 999px;
      background: var(--surface-muted);
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      transition: transform 150ms ease;
    }

    .switch-control input:checked + .switch-track {
      border-color: var(--accent);
      background: var(--accent);
    }

    .switch-control input:checked + .switch-track::after {
      transform: translateX(24px);
    }

    .switch-control input:focus-visible + .switch-track {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .input-with-suffix {
      position: relative;
    }

    .input-with-suffix input {
      padding-right: 50px;
    }

    .input-suffix {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 800;
      pointer-events: none;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .feedback-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-top: 8px;
    }

    .feedback-option {
      position: relative;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 8px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }

    .feedback-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .feedback-option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .feedback-option:has(input:focus-visible) {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
    }

    .key-item {
      width: 100%;
      min-height: 74px;
      min-width: 0;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-muted);
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition:
        border-color 150ms ease,
        background-color 150ms ease,
        transform 80ms ease;
    }

    .key-item:hover {
      border-color: var(--line-strong);
      background: var(--surface);
    }

    .key-item:active,
    .key-item.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(1px);
    }

    .key-copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .key-copy strong {
      font-size: 0.98rem;
      line-height: 1.35;
    }

    .key-copy small {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 650;
      line-height: 1.35;
    }

    kbd {
      min-height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-bottom-width: 3px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--accent-strong);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 900;
    }

    .hardware-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 16px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.94rem;
    }

    .hardware-line strong {
      color: var(--ink);
    }

    .save-bar {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      padding:
        12px
        max(14px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      border-top: 1px solid var(--line-strong);
      background: var(--surface);
      box-shadow: 0 -10px 28px rgba(20, 42, 32, 0.1);
    }

    .save-bar-inner {
      width: min(100%, 912px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .save-state {
      min-width: 0;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 700;
    }

    .save-state[data-state="success"] {
      color: var(--accent-strong);
    }

    .save-state[data-state="error"] {
      color: var(--danger);
    }

    .save-button {
      min-height: 56px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 22px;
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent);
      color: #ffffff;
      font-size: 1.04rem;
      font-weight: 900;
      cursor: pointer;
    }

    .save-button:hover {
      border-color: var(--accent-strong);
      background: var(--accent-strong);
    }

    .toast {
      position: fixed;
      z-index: 30;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      width: min(calc(100% - 28px), 680px);
      transform: translate(-50%, -150%);
      padding: 13px 16px;
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 14px 36px rgba(15, 40, 28, 0.22);
      font-weight: 800;
      text-align: center;
      transition: transform 180ms ease;
      pointer-events: none;
    }

    .toast.is-visible {
      transform: translate(-50%, 0);
    }

    .toast[data-state="error"] {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      body {
        font-size: 17px;
      }

      .shell {
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .page-header {
        align-items: flex-start;
        padding-bottom: 16px;
      }

      h1 {
        font-size: 1.9rem;
      }

      .brand {
        gap: 11px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      .connection-badge {
        width: 42px;
        min-height: 42px;
        justify-content: center;
        padding: 0;
      }

      .connection-label {
        display: none;
      }

      .section {
        padding: 18px;
      }

      .field-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }

      .field.full {
        grid-column: auto;
      }

      .feedback-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .key-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .save-bar-inner {
        gap: 10px;
      }

      .save-state {
        max-width: 44%;
        line-height: 1.3;
      }

      .save-button {
        min-width: 168px;
        padding-inline: 16px;
      }
    }

    @media (max-width: 420px) {
      .eyebrow {
        display: none;
      }

      h1 {
        font-size: 1.5rem;
      }

      .section {
        padding: 16px;
      }

      .stock-row-head {
        grid-template-columns: 34px minmax(0, 1fr) 46px;
        gap: 7px;
      }

      .stock-remove {
        width: 46px;
      }

      .stock-market {
        margin-top: 11px;
      }

      .stock-stat {
        padding: 9px 8px;
      }

      .stock-stat-value {
        font-size: 1rem;
      }

      .stock-limits {
        grid-template-columns: minmax(0, 1fr);
        gap: 11px;
      }

      .save-state {
        display: none;
      }

      .save-button {
        width: 100%;
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="page-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M3 3v18h18"></path>
            <path d="m7 15 4-5 3 3 5-7"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">1.3 英寸 OLED 本地显示</p>
          <h1>股票监控设备</h1>
        </div>
      </div>
      <div class="connection-badge" id="connectionBadge" data-state="loading">
        <span class="connection-dot" aria-hidden="true"></span>
        <span class="connection-label" id="connectionLabel">读取中</span>
      </div>
    </header>

    <main>
      <section class="section" aria-labelledby="wifiTitle">
        <div class="section-head">
          <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
              <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
              <path d="M12 20h.01"></path>
            </svg>
            <div>
              <h2 id="wifiTitle">网络连接</h2>
              <p class="section-note">设备通过此网络获取股票行情</p>
            </div>
          </div>
        </div>

        <div class="status-strip">
          <span>配置热点 <strong id="apSsid">--</strong></span>
          <span>当前网络 <strong id="currentSsid">未连接</strong></span>
          <span>设备地址 <strong id="deviceIp">--</strong></span>
        </div>

        <div class="field-grid">
          <div class="field full">
            <label class="field-label" for="wifiSsid">Wi-Fi 名称</label>
            <select id="wifiNetwork" aria-label="扫描到的 Wi-Fi">
              <option value="">选择扫描到的网络</option>
            </select>
            <input id="wifiSsid" type="text" autocomplete="off"
                   autocapitalize="off" spellcheck="false"
                   maxlength="32" placeholder="输入 Wi-Fi 名称">
          </div>

          <div class="field full">
            <label class="field-label" for="wifiPassword">Wi-Fi 密码</label>
            <div class="input-action">
              <input id="wifiPassword" type="password" autocomplete="current-password"
                     maxlength="64" placeholder="开放网络可不填写">
              <button class="input-icon-button" id="passwordToggle" type="button"
                      aria-label="显示密码" title="显示密码">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="field full">
            <div class="wifi-actions">
              <button class="field-action" id="scanButton" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="2.5"></circle>
                </svg>
                扫描附近网络
              </button>
              <button class="field-action primary" id="wifiConnectButton" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                  <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                  <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                  <path d="M12 20h.01"></path>
                </svg>
                连接网络
              </button>
            </div>
          </div>
        </div>
      </section>

      <form id="configForm">
        <div class="section-stack">
          <section class="section" aria-labelledby="stocksTitle">
            <div class="section-head">
              <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M3 3v18h18"></path>
                  <path d="m7 15 4-5 3 3 5-7"></path>
                </svg>
                <div>
                  <h2 id="stocksTitle">股票列表</h2>
                  <p class="section-note">每只股票独立显示行情并设置价格上下限，最多 8 只</p>
                </div>
              </div>
            </div>

            <div class="stock-list" id="stockList"></div>
            <button class="stock-add" id="addStockButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
              添加股票
            </button>
          </section>

          <section class="section" aria-labelledby="alertsTitle">
            <div class="section-head">
              <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M10.27 21a2 2 0 0 0 3.46 0"></path>
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                </svg>
                <div>
                  <h2 id="alertsTitle">刷新与提醒</h2>
                  <p class="section-note">设置自动刷新和全局提醒方式</p>
                </div>
              </div>
            </div>

            <div class="field-grid">
              <div class="field">
                <label class="field-label" for="refreshSeconds">刷新周期</label>
                <select id="refreshSeconds">
                  <option value="15">15 秒</option>
                  <option value="30">30 秒</option>
                  <option value="60">1 分钟</option>
                  <option value="120">2 分钟</option>
                  <option value="300">5 分钟</option>
                  <option value="600">10 分钟</option>
                </select>
              </div>

              <div class="field full">
                <label class="switch-field" for="alertsEnabled">
                  <span class="switch-copy">
                    价格提醒
                    <small>关闭后仍会正常刷新每只股票的行情</small>
                  </span>
                  <span class="switch-control">
                    <input id="alertsEnabled" type="checkbox">
                    <span class="switch-track" aria-hidden="true"></span>
                  </span>
                </label>
              </div>

              <fieldset class="field full">
                <legend>提醒方式</legend>
                <div class="feedback-options" id="feedbackOptions">
                  <label class="feedback-option">
                    <input type="radio" name="feedbackMode" value="both">
                    <span>声音 + 震动</span>
                  </label>
                  <label class="feedback-option">
                    <input type="radio" name="feedbackMode" value="vibrate">
                    <span>仅震动</span>
                  </label>
                  <label class="feedback-option">
                    <input type="radio" name="feedbackMode" value="sound">
                    <span>仅声音</span>
                  </label>
                  <label class="feedback-option">
                    <input type="radio" name="feedbackMode" value="silent">
                    <span>静音</span>
                  </label>
                </div>
              </fieldset>
            </div>
          </section>
        </div>
      </form>

      <section class="section" aria-labelledby="keysTitle">
        <div class="section-head">
          <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M7 9h.01M11 9h.01M15 9h.01M7 13h.01M11 13h.01M15 13h.01"></path>
            </svg>
            <div>
              <h2 id="keysTitle">按键操作</h2>
              <p class="section-note">股票行情仅在设备 OLED 屏幕显示</p>
            </div>
          </div>
        </div>

        <div class="key-grid" aria-label="设备按键">
          <button class="key-item" type="button" data-button="k1"
                  aria-label="K1，上一只；长按回到第一只">
            <kbd>K1</kbd>
            <span class="key-copy">
              <strong>上一只</strong>
              <small>长按回到第一只</small>
            </span>
          </button>
          <button class="key-item" type="button" data-button="k2"
                  aria-label="K2，下一只；长按跳到最后一只">
            <kbd>K2</kbd>
            <span class="key-copy">
              <strong>下一只</strong>
              <small>长按跳到最后一只</small>
            </span>
          </button>
          <button class="key-item" type="button" data-button="k3"
                  aria-label="K3，立即刷新行情">
            <kbd>K3</kbd>
            <span class="key-copy">
              <strong>立即刷新行情</strong>
            </span>
          </button>
          <button class="key-item" type="button" data-button="k4"
                  aria-label="K4，切换报价、指标、综合分析；长按回到报价页">
            <kbd>K4</kbd>
            <span class="key-copy">
              <strong>切换报价、指标、综合分析</strong>
              <small>长按回到报价页</small>
            </span>
          </button>
        </div>

        <div class="hardware-line">
          <span>显示屏 <strong id="oledSummary">1.3 英寸 128×64</strong></span>
          <span>按键 <strong id="buttonPins">K1-K4</strong></span>
        </div>
      </section>
    </main>
  </div>

  <footer class="save-bar">
    <div class="save-bar-inner">
      <span class="save-state" id="saveState" data-state="idle"
            role="status" aria-live="polite">读取设备配置</span>
      <button class="save-button" id="saveButton" type="submit"
              form="configForm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
          <path d="M17 21v-8H7v8M7 3v5h8"></path>
        </svg>
        保存配置
      </button>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const MAX_STOCKS = 8;
      const DEFAULT_REFRESH_SECONDS = 30;
      const MIN_ALERT_PRICE = 0.01;
      const MAX_ALERT_PRICE = 10000;
      const stockList = document.getElementById("stockList");
      const addStockButton = document.getElementById("addStockButton");
      const configForm = document.getElementById("configForm");
      const saveButton = document.getElementById("saveButton");
      const saveState = document.getElementById("saveState");
      const connectionBadge = document.getElementById("connectionBadge");
      const connectionLabel = document.getElementById("connectionLabel");
      const toast = document.getElementById("toast");
      const alertsEnabled = document.getElementById("alertsEnabled");
      const refreshSeconds = document.getElementById("refreshSeconds");
      const wifiNetwork = document.getElementById("wifiNetwork");
      const wifiSsid = document.getElementById("wifiSsid");
      const wifiPassword = document.getElementById("wifiPassword");
      const wifiConnectButton = document.getElementById("wifiConnectButton");
      const scanButton = document.getElementById("scanButton");
      const passwordToggle = document.getElementById("passwordToggle");
      const keyButtons = [...document.querySelectorAll("[data-button]")];
      const keyLongPressMs = 800;
      let toastTimer = null;
      let configDirty = false;
      let wifiPollTimer = null;
      let keyRequestChain = Promise.resolve();

      function setConnection(state, label) {
        connectionBadge.dataset.state = state;
        connectionLabel.textContent = label;
        connectionBadge.title = label;
      }

      function setSaveState(message, state = "idle") {
        saveState.textContent = message;
        saveState.dataset.state = state;
      }

      function showToast(message, state = "success") {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.dataset.state = state;
        toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 3600);
      }

      function pulseKeyButton(button) {
        button.classList.add("is-active");
        window.setTimeout(() => {
          button.classList.remove("is-active");
        }, 180);
      }

      function queueKeyAction(button, action) {
        const name = button.dataset.button.toUpperCase();
        const actionLabel = action === "long" ? "长按" : "点击";

        pulseKeyButton(button);
        keyRequestChain = keyRequestChain.then(async () => {
          try {
            await requestJson("/api/v1/buttons", {
              method: "POST",
              body: JSON.stringify({
                button: button.dataset.button,
                action
              })
            });
            showToast(`${name} ${actionLabel}已执行`);
          } catch (error) {
            if (error instanceof TypeError) {
              setConnection("offline", "设备离线");
            }
            showToast(error.message || "按键操作失败", "error");
          }
        });
      }

      function bindKeyButton(button) {
        let longPressTimer = null;
        let longPressTriggered = false;

        function clearLongPress() {
          window.clearTimeout(longPressTimer);
          longPressTimer = null;
        }

        button.addEventListener("pointerdown", (event) => {
          if (!event.isPrimary ||
              (event.pointerType === "mouse" && event.button !== 0)) {
            return;
          }
          clearLongPress();
          longPressTriggered = false;
          longPressTimer = window.setTimeout(() => {
            longPressTimer = null;
            longPressTriggered = true;
            queueKeyAction(button, "long");
          }, keyLongPressMs);
        });
        button.addEventListener("pointerup", clearLongPress);
        button.addEventListener("pointercancel", () => {
          clearLongPress();
          longPressTriggered = false;
        });
        button.addEventListener("click", () => {
          clearLongPress();
          if (longPressTriggered) {
            longPressTriggered = false;
            return;
          }
          queueKeyAction(button, "short");
        });
        button.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
      }

      function markDirty() {
        configDirty = true;
        setSaveState("有未保存的修改");
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          cache: "no-store",
          headers: {
            "Accept": "application/json",
            ...(options.body ? { "Content-Type": "application/json" } : {})
          },
          ...options
        });
        let data = null;

        try {
          data = await response.json();
        } catch (error) {
          data = null;
        }
        if (!response.ok) {
          throw new Error(
            data && data.message
              ? data.message
              : `请求失败 (${response.status})`
          );
        }
        return data;
      }

      function normalizeSymbol(value) {
        return String(value || "").trim().toLowerCase();
      }

      function formatQuotePrice(value, valid) {
        const price = Number(value);

        return valid && Number.isFinite(price) && price > 0
          ? price.toFixed(2)
          : "--";
      }

      function formatLimitPrice(value) {
        const price = Number(value);

        return Number.isFinite(price) && price > 0
          ? price.toFixed(2)
          : "";
      }

      function createStockStat(label, role, withChange = false) {
        const stat = document.createElement("div");
        const labelElement = document.createElement("span");
        const valueElement = document.createElement("strong");

        stat.className = "stock-stat";
        labelElement.className = "stock-stat-label";
        labelElement.textContent = label;
        valueElement.className = "stock-stat-value";
        if (role === "current") {
          valueElement.classList.add("stock-current-value");
        }
        valueElement.dataset.role = role;
        stat.append(labelElement, valueElement);

        if (withChange) {
          const change = document.createElement("small");
          change.className = "stock-stat-change";
          change.dataset.role = "change";
          stat.append(change);
        }
        return stat;
      }

      function renderStockQuote(row, item) {
        const valid = Boolean(item.valid);
        const current = Number(item.price);
        const upper = Number(item.alert_upper_price) || 0;
        const lower = Number(item.alert_lower_price) || 0;
        const change = Number(item.change_percent);
        const changeElement = row.querySelector('[data-role="change"]');

        row.querySelector('[data-role="current"]').textContent =
          formatQuotePrice(current, valid);
        row.querySelector('[data-role="high"]').textContent =
          formatQuotePrice(item.high, valid);
        row.querySelector('[data-role="low"]').textContent =
          formatQuotePrice(item.low, valid);

        if (valid && Number.isFinite(change)) {
          changeElement.textContent =
            `${change > 0 ? "+" : ""}${change.toFixed(2)}%`;
          changeElement.dataset.direction =
            change > 0 ? "up" : change < 0 ? "down" : "flat";
        } else {
          changeElement.textContent = "等待行情";
          changeElement.dataset.direction = "flat";
        }

        row.classList.toggle(
          "is-upper-alert",
          valid && upper > 0 && current >= upper
        );
        row.classList.toggle(
          "is-lower-alert",
          valid && lower > 0 && current <= lower
        );
      }

      function createStockRow(value = {}) {
        const item = typeof value === "string" ? { symbol: value } : value;
        const row = document.createElement("div");
        row.className = "stock-row";

        const head = document.createElement("div");
        head.className = "stock-row-head";

        const index = document.createElement("span");
        index.className = "stock-index";

        const symbolField = document.createElement("label");
        symbolField.className = "stock-symbol-field";
        const symbolLabel = document.createElement("span");
        symbolLabel.className = "stock-symbol-label";
        symbolLabel.textContent = "股票代码";
        const input = document.createElement("input");
        input.type = "text";
        input.inputMode = "text";
        input.autocomplete = "off";
        input.autocapitalize = "off";
        input.spellcheck = false;
        input.maxLength = 12;
        input.placeholder = "例如 sh600519";
        input.value = normalizeSymbol(item.symbol);
        input.setAttribute("aria-label", "股票代码");
        symbolField.append(symbolLabel, input);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "stock-remove";
        remove.title = "删除这只股票";
        remove.setAttribute("aria-label", "删除这只股票");
        remove.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">' +
          '<path d="M3 6h18"></path><path d="M8 6V4h8v2"></path>' +
          '<path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path>' +
          "</svg>";

        const market = document.createElement("div");
        market.className = "stock-market";
        market.append(
          createStockStat("当前价", "current", true),
          createStockStat("今日最高", "high"),
          createStockStat("今日最低", "low")
        );

        const limits = document.createElement("div");
        limits.className = "stock-limits";

        function createLimitField(label, className, hint) {
          const field = document.createElement("label");
          const labelElement = document.createElement("span");
          const inputWrap = document.createElement("div");
          const limitInput = document.createElement("input");
          const suffix = document.createElement("span");
          const hintElement = document.createElement("p");

          field.className = "stock-limit-field";
          labelElement.className = "stock-limit-label";
          labelElement.textContent = label;
          inputWrap.className = "input-with-suffix";
          limitInput.type = "number";
          limitInput.className = className;
          limitInput.min = String(MIN_ALERT_PRICE);
          limitInput.max = String(MAX_ALERT_PRICE);
          limitInput.step = "0.01";
          limitInput.inputMode = "decimal";
          limitInput.placeholder = "留空关闭";
          limitInput.setAttribute("aria-label", label);
          suffix.className = "input-suffix";
          suffix.textContent = "元";
          hintElement.className = "stock-limit-hint";
          hintElement.textContent = hint;
          inputWrap.append(limitInput, suffix);
          field.append(labelElement, inputWrap, hintElement);
          field.dataset.input = className;
          return { field, input: limitInput };
        }

        const upperField = createLimitField(
          "上限提醒",
          "stock-upper-price",
          "达到后红灯提醒卖出"
        );
        const lowerField = createLimitField(
          "下限提醒",
          "stock-lower-price",
          "达到后绿灯提醒买入"
        );
        upperField.input.value = formatLimitPrice(item.alert_upper_price);
        lowerField.input.value = formatLimitPrice(item.alert_lower_price);
        limits.append(upperField.field, lowerField.field);

        head.append(index, symbolField, remove);
        row.append(head, market, limits);

        input.addEventListener("input", () => {
          input.removeAttribute("aria-invalid");
          markDirty();
        });
        [upperField.input, lowerField.input].forEach((limitInput) => {
          limitInput.addEventListener("input", () => {
            limitInput.removeAttribute("aria-invalid");
            markDirty();
          });
        });
        remove.addEventListener("click", () => {
          row.remove();
          updateStockRows();
          markDirty();
        });

        renderStockQuote(row, item);
        stockList.append(row);
        updateStockRows();
        return input;
      }

      function updateStockRows() {
        const rows = [...stockList.querySelectorAll(".stock-row")];

        rows.forEach((row, index) => {
          row.querySelector(".stock-index").textContent = `#${index + 1}`;
          row.querySelector(".stock-remove").hidden = rows.length <= 1;
        });
        addStockButton.hidden = rows.length >= MAX_STOCKS;
      }

      function renderStocks(items, symbols) {
        let values = [];

        if (Array.isArray(items) && items.length) {
          values = items.slice(0, MAX_STOCKS);
        } else if (Array.isArray(symbols) && symbols.length) {
          values = symbols.slice(0, MAX_STOCKS).map((symbol) => ({
            symbol,
            valid: false
          }));
        } else {
          values = [{}];
        }

        stockList.replaceChildren();
        values.forEach((item) => createStockRow(item));
        updateStockRows();
      }

      function ensureRefreshOption(seconds) {
        const value = String(seconds);
        let option = refreshSeconds.querySelector(`option[value="${value}"]`);

        if (!option) {
          option = document.createElement("option");
          option.value = value;
          option.textContent = `${value} 秒`;
          refreshSeconds.append(option);
        }
        refreshSeconds.value = value;
      }

      function selectFeedbackMode(mode) {
        const input = document.querySelector(
          `input[name="feedbackMode"][value="${mode}"]`
        );

        if (input) {
          input.checked = true;
        }
      }

      function updateAlertControls() {
        stockList
          .querySelectorAll(".stock-upper-price, .stock-lower-price")
          .forEach((input) => {
            input.disabled = !alertsEnabled.checked;
          });
      }

      function renderConfig(data) {
        const wifi = data.wifi || {};
        const stock = data.stock || {};
        const board = data.board || {};

        document.getElementById("apSsid").textContent =
          wifi.ap_ssid || "--";
        document.getElementById("currentSsid").textContent =
          wifi.ssid || (wifi.connected ? "已连接" : "未连接");
        document.getElementById("deviceIp").textContent = wifi.ip || "--";

        if (wifi.connected) {
          setConnection("online", "网络已连接");
        } else if (wifi.connecting) {
          setConnection("warning", "正在连接");
        } else {
          setConnection("warning", "配置热点");
        }

        if (wifi.ssid && !wifiSsid.value) {
          wifiSsid.value = wifi.ssid;
        }
        renderStocks(stock.items, stock.symbols);
        ensureRefreshOption(stock.refresh_seconds || DEFAULT_REFRESH_SECONDS);
        alertsEnabled.checked = Boolean(stock.alerts_enabled);
        selectFeedbackMode(stock.feedback_mode || "both");
        updateAlertControls();

        const oledController = String(
          board.oled_controller || "sh1106"
        ).toUpperCase();
        document.getElementById("oledSummary").textContent =
          `1.3 英寸 128×64 · ${oledController}`;
        const pins = Array.isArray(board.button_gpio)
          ? board.button_gpio
          : [];
        document.getElementById("buttonPins").textContent =
          pins.length === 4
            ? `GPIO ${pins.join(" / ")}`
            : "K1-K4";

        configDirty = false;
        setSaveState(
          wifi.last_error && !wifi.connected
            ? `网络提示：${wifi.last_error}`
            : "配置已同步",
          "success"
        );
      }

      async function loadConfig() {
        if (configDirty) {
          return;
        }

        setConnection("loading", "读取中");
        try {
          const data = await requestJson("/api/v1/config");
          renderConfig(data);
        } catch (error) {
          setConnection("offline", "设备离线");
          setSaveState("无法读取设备配置", "error");
        }
      }

      function parsePriceLimit(input) {
        const raw = input.value.trim();

        if (!raw) {
          return { valid: true, value: null };
        }
        const value = Number(raw);
        if (!Number.isFinite(value) ||
            value < MIN_ALERT_PRICE ||
            value > MAX_ALERT_PRICE) {
          return { valid: false, value: null };
        }
        return {
          valid: true,
          value: Math.round(value * 100) / 100
        };
      }

      function collectStockRows() {
        return [...stockList.querySelectorAll(".stock-row")]
          .map((row, index) => ({
            row,
            index,
            symbolInput: row.querySelector(".stock-symbol-field input"),
            upperInput: row.querySelector(".stock-upper-price"),
            lowerInput: row.querySelector(".stock-lower-price")
          }))
          .map((entry) => ({
            ...entry,
            symbol: normalizeSymbol(entry.symbolInput.value)
          }))
          .filter((entry) => entry.symbol);
      }

      async function saveConfig(event) {
        event.preventDefault();
        const stockRows = collectStockRows();
        const feedbackInput = document.querySelector(
          'input[name="feedbackMode"]:checked'
        );

        if (!stockRows.length) {
          const first = stockList.querySelector(".stock-symbol-field input");
          first.setAttribute("aria-invalid", "true");
          first.focus();
          showToast("请至少填写一只股票", "error");
          return;
        }

        const seenSymbols = new Set();
        const items = [];
        for (const entry of stockRows) {
          if (seenSymbols.has(entry.symbol)) {
            entry.symbolInput.setAttribute("aria-invalid", "true");
            entry.symbolInput.focus();
            showToast(`#${entry.index + 1} 股票代码重复`, "error");
            return;
          }
          seenSymbols.add(entry.symbol);

          const upper = parsePriceLimit(entry.upperInput);
          const lower = parsePriceLimit(entry.lowerInput);
          if (!upper.valid) {
            entry.upperInput.setAttribute("aria-invalid", "true");
            entry.upperInput.focus();
            showToast(
              `#${entry.index + 1} 上限提醒应在 0.01 到 10000 元之间`,
              "error"
            );
            return;
          }
          if (!lower.valid) {
            entry.lowerInput.setAttribute("aria-invalid", "true");
            entry.lowerInput.focus();
            showToast(
              `#${entry.index + 1} 下限提醒应在 0.01 到 10000 元之间`,
              "error"
            );
            return;
          }
          if (upper.value !== null &&
              lower.value !== null &&
              upper.value <= lower.value) {
            entry.upperInput.setAttribute("aria-invalid", "true");
            entry.lowerInput.setAttribute("aria-invalid", "true");
            entry.upperInput.focus();
            showToast(
              `#${entry.index + 1} 上限必须高于下限`,
              "error"
            );
            return;
          }
          items.push({
            symbol: entry.symbol,
            alert_upper_price: upper.value,
            alert_lower_price: lower.value
          });
        }

        saveButton.disabled = true;
        setSaveState("正在保存");
        try {
          const data = await requestJson("/api/v1/config", {
            method: "POST",
            body: JSON.stringify({
              items,
              refresh_seconds: Number(refreshSeconds.value),
              alerts_enabled: alertsEnabled.checked,
              feedback_mode: feedbackInput
                ? feedbackInput.value
                : "both"
            })
          });
          renderConfig(data);
          showToast("配置已保存并立即生效");
        } catch (error) {
          setSaveState("保存失败", "error");
          showToast(error.message || "配置保存失败", "error");
        } finally {
          saveButton.disabled = false;
        }
      }

      async function scanWifi() {
        scanButton.disabled = true;
        scanButton.lastChild.textContent = " 正在扫描";
        try {
          const data = await requestJson("/api/v1/wifi/scan");
          const networks = Array.isArray(data.networks)
            ? data.networks
            : [];

          wifiNetwork.replaceChildren();
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = networks.length
            ? "选择扫描到的网络"
            : "没有扫描到网络";
          wifiNetwork.append(placeholder);
          networks.forEach((network) => {
            const option = document.createElement("option");
            option.value = network.ssid;
            option.textContent =
              `${network.ssid}  ${network.secure ? "加密" : "开放"}`;
            wifiNetwork.append(option);
          });
          wifiNetwork.classList.add("is-visible");
          showToast(networks.length
            ? `发现 ${networks.length} 个网络`
            : "没有扫描到网络，可手动输入名称", "success");
        } catch (error) {
          showToast(error.message || "扫描失败，请稍后重试", "error");
        } finally {
          scanButton.disabled = false;
          scanButton.lastChild.textContent = " 扫描附近网络";
        }
      }

      function scheduleWifiStatusPoll(attempt = 0) {
        window.clearTimeout(wifiPollTimer);
        if (attempt >= 8) {
          return;
        }
        wifiPollTimer = window.setTimeout(async () => {
          try {
            const data = await requestJson("/api/v1/config");
            const wifi = data.wifi || {};

            document.getElementById("currentSsid").textContent =
              wifi.ssid || "未连接";
            document.getElementById("deviceIp").textContent =
              wifi.ip || "--";
            if (wifi.connected) {
              setConnection("online", "网络已连接");
              setSaveState("网络已连接", "success");
              showToast("Wi-Fi 已连接");
              return;
            }
            if (wifi.connecting) {
              setConnection("warning", "正在连接");
              scheduleWifiStatusPoll(attempt + 1);
            } else {
              setConnection(
                wifi.last_error ? "offline" : "warning",
                wifi.last_error ? "连接失败" : "配置热点"
              );
              if (wifi.last_error) {
                setSaveState(`网络提示：${wifi.last_error}`, "error");
              }
            }
          } catch (error) {
            setConnection("offline", "设备离线");
          }
        }, 1500);
      }

      async function connectWifi() {
        const ssid = wifiSsid.value.trim();
        const password = wifiPassword.value;

        wifiSsid.removeAttribute("aria-invalid");
        wifiPassword.removeAttribute("aria-invalid");
        if (!ssid) {
          wifiSsid.setAttribute("aria-invalid", "true");
          wifiSsid.focus();
          showToast("请输入 Wi-Fi 名称", "error");
          return;
        }
        if (password.length > 0 && password.length < 8) {
          wifiPassword.setAttribute("aria-invalid", "true");
          wifiPassword.focus();
          showToast("Wi-Fi 密码至少需要 8 位", "error");
          return;
        }

        wifiConnectButton.disabled = true;
        setConnection("warning", "正在连接");
        setSaveState("正在连接 Wi-Fi");
        try {
          await requestJson("/api/v1/wifi", {
            method: "POST",
            body: JSON.stringify({ ssid, password })
          });
          showToast(`正在连接 ${ssid}`);
          scheduleWifiStatusPoll();
        } catch (error) {
          setConnection("offline", "连接失败");
          setSaveState(error.message || "网络连接失败", "error");
          showToast(error.message || "网络连接失败", "error");
        } finally {
          wifiConnectButton.disabled = false;
        }
      }

      addStockButton.addEventListener("click", () => {
        if (stockList.children.length >= MAX_STOCKS) {
          return;
        }
        const input = createStockRow();
        input.focus();
        markDirty();
      });

      configForm.addEventListener("input", markDirty);
      configForm.addEventListener("change", markDirty);
      configForm.addEventListener("submit", saveConfig);
      alertsEnabled.addEventListener("change", updateAlertControls);
      scanButton.addEventListener("click", scanWifi);
      wifiConnectButton.addEventListener("click", connectWifi);
      wifiNetwork.addEventListener("change", () => {
        if (wifiNetwork.value) {
          wifiSsid.value = wifiNetwork.value;
        }
        wifiSsid.focus();
      });
      wifiSsid.addEventListener("input", () => {
        wifiSsid.removeAttribute("aria-invalid");
      });
      wifiPassword.addEventListener("input", () => {
        wifiPassword.removeAttribute("aria-invalid");
      });
      passwordToggle.addEventListener("click", () => {
        const visible = wifiPassword.type === "password";
        wifiPassword.type = visible ? "text" : "password";
        passwordToggle.setAttribute(
          "aria-label",
          visible ? "隐藏密码" : "显示密码"
        );
        passwordToggle.title = visible ? "隐藏密码" : "显示密码";
        document.getElementById("eyeIcon").style.opacity =
          visible ? "0.55" : "1";
      });
      keyButtons.forEach(bindKeyButton);

      renderStocks([], [""]);
      updateAlertControls();
      loadConfig();
      window.setInterval(loadConfig, 30000);
      window.addEventListener("online", loadConfig);
      window.addEventListener("offline", () => {
        setConnection("offline", "设备离线");
      });
    })();
  </script>
</body>
</html>
